[package]
name = "rpi_rx_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
serialport = "4.2.0"
csv = "1.3.0"
chrono = { version = "0.4", features = ["serde"] } # Added serde feature for potential future use, not strictly necessary for this task
log = "0.4"
env_logger = "0.11"
cobs = "0.3"
serde = { version = "1.0", features = ["derive"] }
byteorder = "1.5"

