[package]
name = "rpi_rx_rust"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Build GPIO-controlled service binary (Linux only; requires libgpiod)
gpio = ["gpiod"]

[[bin]]
name = "rpi_rx_rust"
path = "src/main.rs"

[[bin]]
name = "ahrs_postprocess"
path = "src/bin/ahrs_postprocess.rs"

[[bin]]
name = "gps_extract"
path = "src/bin/gps_extract.rs"

[[bin]]
name = "rpi_rx_rust_gpio"
path = "src/bin/rpi_rx_rust_gpio.rs"
required-features = ["gpio"]

[dependencies]
serialport = "4.2.0"
csv = "1.3.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
cobs = "0.3"
serde = { version = "1.0", features = ["derive"] }
byteorder = "1.5"
clap = { version = "4", features = ["derive"] }

# AHRS (--with-ahrs and ahrs_postprocess binary)
ahrs = { version = "0.7", features = ["field_access"] }
nalgebra = "0.33"

# GPIO-controlled service (Linux, libgpiod)
gpiod = { version = "0.3", optional = true }

