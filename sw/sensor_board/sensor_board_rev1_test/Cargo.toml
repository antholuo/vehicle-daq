[workspace]
resolver = "3"

[package]
edition      = "2024"
name         = "sensor_board_rev1_test"
rust-version = "1.88"
version      = "0.1.0"
default-run  = "rev1_board"

[features]
default = ["hmi", "imu", "gps", "wifi", "set_gps_high_baud", "set_gps_10hz"]
bridge  = ["hmi", "usb", "wifi"]
hmi = []      # User LED, NeoPixel, Display
imu = []      # IMU sensor (SPI)
gps = []      # GPS sensor (UART)
set_gps_high_baud = [] # Optional: configure GPS to high baudrate (non-default)
set_gps_10hz = []      # Optional: configure GPS update rate to 10Hz (non-default)
wifi = []     # WiFi/ESP-NOW wireless communication
usb = []      # USB Serial for bridge data forwarding

# Car position for sensor nodes (mutually exclusive - pick one)
# Usage: --features "pos_front_left" or set in default features
pos_front_left = []
pos_front_center = []
pos_front_right = []
pos_left = []
pos_center = []
pos_right = []
pos_rear_left = []
pos_rear_center = []
pos_rear_right = []
pos_roof = []

# Flashing a sensor board for data acquisition:
# cargo build --bin rev1_board --features "pos_center"
# (replace pos_center with desired position, default features hmi/imu/gps/wifi are included)

# Flashing a bridge board for data forwarding:
# cargo build --bin devkit_c --no-default-features --features "bridge"

[[bin]]
# A shorter name
name = "rev1_board"
path = "./src/bin/sensorboard_rev1.rs"

[[bin]]
name = "devkit_c"
path = "./src/bin/devkit_c.rs"

[dependencies]
# esp-hal ecosystem - using git directly until crates.io catches up with async RMT API
# TODO: Switch to version-based deps + [patch.crates-io] when versions align
# See: https://doc.rust-lang.org/cargo/reference/overriding-dependencies.html#using-patch-with-multiple-versions
esp-hal = { git = "https://github.com/esp-rs/esp-hal", branch = "main", package = "esp-hal", features = ["esp32c6", "log-04", "unstable"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", branch = "main", package = "esp-rtos", features = ["esp32c6", "esp-alloc", "embassy", "esp-radio"] }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", branch = "main", package = "esp-alloc" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", branch = "main", package = "esp-bootloader-esp-idf", features = ["esp32c6"] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", branch = "main", package = "esp-println", default-features = false, features = ["esp32c6", "log-04", "jtag-serial", "colors", "critical-section"] }

# ESP-NOW wireless communication
esp-radio = { git = "https://github.com/esp-rs/esp-hal", branch = "main", package = "esp-radio", features = ["esp32c6", "esp-now", "unstable", "esp-alloc"] }

log = "0.4.27"
critical-section = "1.2.0"
embedded-hal = "1.0.0"
embassy-executor = "0.9.1"
embassy-time = "0.5.0"
nmea-parser = { path = "../../Drivers/nmea-parser/", default-features = false, features = [] }
heapless = "0.9.2"
byteorder = { version = "1.5", default-features = false }
cobs = { version = "0.3", default-features = false }
nb = "1.1.0"
embassy-embedded-hal = "0.5.0"
static_cell = "2.1.1"
embassy-sync = "0.7.2"
embedded-hal-async = "1.0.0"
embassy-time-queue-utils = "0.3.0"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

# Patch esp-hal-procmacros for compatibility with git dependencies
[patch.crates-io]
esp-hal = { git = "https://github.com/esp-rs/esp-hal", branch = "main", package = "esp-hal" }
esp-hal-procmacros = { git = "https://github.com/esp-rs/esp-hal", branch = "main", package = "esp-hal-procmacros" }
