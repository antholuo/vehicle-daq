syntax="proto3";

// Keeping this super duper simple for now - don't want to overcomplicate it at all
message ImuData {
    sint32 timestamp = 1;
    sint32 accel_x_mg = 2;
    sint32 accel_y_mg = 3;
    sint32 accel_z_mg = 4;
    sint32 gyro_x_mdps = 5;
    sint32 gyro_y_mdps = 6;
    sint32 gyro_z_mdps = 7;
    bool gyro_data_valid = 8;
    bool accel_data_valid = 9;
    enum FilterMode {
        IMU_UNFILTERED = 0;
        IMU_MOVING_AVERAGE = 1;
    }
}


message GpsData {
    message UtcTime {
        uint32 hours = 1;
        uint32 minutes = 2;
        uint32 seconds = 3;
    }

    message UtcDate {
        uint32 year = 1;
        uint32 month = 2;
        uint32 day = 3;
    }

    UtcTime time = 1;
    UtcDate date = 2;

    sint32 lat_microdeg = 3;
    sint32 lon_microdeg = 4;
    sint32 altitude_mm = 5;
    sint32 speed_mkts = 6;
    sint32 course_deg = 7;
    sint32 quality = 8;
    sint32 num_sats = 9;
    bool data_valid = 10;
}

